name: Solar System Workflow

on:
    workflow_dispatch:
    push:
        branches:
          - main
          - 'feature/*'

env:
    MONGO_URI : 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME}}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD}}
jobs:
    unit-testing:
        name: Unit Testing
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            ports:
              - 27017:27017
        env:
          MONGO_URI: 'mongodb://localhost:27017/superData'
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password
        strategy:
            matrix:
              nodejs_version: [18,20]
              operating_system: [ubuntu-latest]
              #operating_system: [ubuntu-latest,macos-latest]
              exclude:
                  - nodejs_version: 18
                    operating_system: macos-latest
        runs-on: ${{matrix.operating_system}}
        steps:
        
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - ${{matrix.nodejs_version}}
          uses: actions/setup-node@v3
          with:
            node-version: ${{matrix.nodejs_version}}
        
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{runner.os}}-nodes-modules-${{ hashFiles('package-lock.json')}}

        - name: Install Dependencies
          run: npm install

        - name: Unit Testing
          id: unit-test-nodejs
          run: npm test

        # - name: Output Name in matrix
        #   run: |
        #     jq -cn  --arg runner ${{ matrix.runner }} --arg outcome ${{ steps.main-step.outcome }} '$ARGS.named' > outcome
        
        - name: Archive Test Results
          id: archive-test-results
          #if: failure() && (steps.unit-test-nodejs.outcome == 'failure' || steps.unit-test-nodejs.outcome == 'success')
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result-${{matrix.nodejs_version}}-${{matrix.operating_system}}
            #name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
        name: Code Coverage
        container: # The steps are running in this container
          image: node:19
        services:
          mongo-db:
            image: siddharth67/mongo-db:non-prod
            options:
              --name mongo

        env:
          MONGO_URI: 'mongodb://mongo:27017/superData'
          MONGO_USERNAME: non-prod-user
          MONGO_PASSWORD: non-prod-password
        runs-on: ubuntu-latest
        steps:
        
        - name: Checkout Repository
          uses: actions/checkout@v4

        # - name: Setup NodeJS Version - 19
        #   uses: actions/setup-node@v3
        #   with:
        #     node-version: 19
        
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: node_modules
            key: ${{runner.os}}-nodes-modules-${{ hashFiles('package-lock.json')}}

        - name: Install Dependencies
          run: npm install

        - name: Check Code Coverage
          continue-on-error: true
          run: npm run coverage
        
        - name: Archive Test Results
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            retention-days: 5

    reports-s3:
      environment: development
      needs: [code-coverage, unit-testing]
      runs-on: ubuntu-latest
      continue-on-error: true
      steps:
        - name: Download Mocha Test Artifact
          uses: actions/download-artifact@v5
          with:
            name: Mocha-Test-Result-18-ubuntu-latest 

        - name: Download Code Coverage Artifact
          uses: actions/download-artifact@v5
          with:
            name: Code-Coverage-Result

        - name: Merge Test Files
          run: |
            ls -ltr
            mkdir reports-${{github.sha}}
            mv cobertura-coverage.xml reports-${{github.sha}}/
            mv test-results.xml reports-${{github.sha}}/
            ls -ltr reports-${{github.sha}}/
        
        - name: Upload to AWS S3
          run: echo "uploading ..."
        
        - name: Upload to AWS S3
          uses: jakejarvis/s3-sync-action@master
          with:
            args: --follow-symlinks --delete
          env:
            AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION: 'us-west-1'   # optional: defaults to us-east-1
            SOURCE_DIR: 'reports-${{github.sha}}'      # optional: defaults to entire repository
            DEST_DIR: 'reports-${{github.sha}}'

    docker:
      name: Containerization
      needs: [unit-testing,code-coverage]
      permissions: # Github token permission to write packages
        packages: write
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        
        - name: DockerHub Login
          uses: docker/login-action@v2.2.0
          with:
            username: ${{vars.DOCKERHUB_USERNAME}}
            password: ${{secrets.DOCKERHUB_PASSWORD}}

        - name: GHCR(GithubContainerRegistry) Login
          uses: docker/login-action@v2.2.0
          with:
            registry: ghcr.io
            username: ${{github.repository_owner}}
            password: ${{secrets.GITHUB_TOKEN}} #by default created by github and live the time the pipeline runs
        
        - name: Docker Build for Testing
          uses: docker/build-push-action@v4
          with:
            context: .
            push: false
            tags: ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}

        - name: Docker Image Testing
          run: |
            docker images
            docker run --name solar-system-app -d \
                -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGO_PASSWORD \
                ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}

            export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP

            echo Testing Image URL using wget
            wget -q -O - 127.0.0.1:3000/live | grep live

        # - name: Docker Push
        #   uses: docker/build-push-action@v4
        #   with:
        #     context: .
        #     push: true
        #     tags: ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}            
        - name: Convert to lowercase
          id: convert_to_lowercase
          run: |
            INPUT_STRING="${{ github.repository_owner }}"
            LOWERCASE_STRING=$(echo "$INPUT_STRING" | tr '[:upper:]' '[:lower:]')
            echo "LOWERCASE_VAR=$LOWERCASE_STRING" >> $GITHUB_OUTPUT

        - name: Docker Registry Push
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: | 
              ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{github.sha}}            
              ghcr.io/${{ steps.convert_to_lowercase.outputs.LOWERCASE_VAR }}/solar-system:${{github.sha}}

    dev-deploy:
      if: contains(github.ref, 'feature/')
      needs: docker
      uses: ./.github/workflows/reuse-deployment.yml
      with:
        mongodb-uri: ${{vars.MONGO_URI}}
        environment: development
        k8s-manifest-dir: kubernetes/development
      secrets:
        k8s-kubeconfig: ${{secrets.KUBECONFIG}}
        mongodb-password: ${{secrets.MONGO_PASSWORD}}

    integration-testing:
      if: contains(github.ref, 'feature/') # if main if: github.ref == 'refs/heads/main'
      name: Dev Integration Testing
      needs: dev-deploy
      runs-on: ubuntu-latest
      steps:
        - name: Test URL Output using CURL and JQ
          env:
            # URL: ${{needs.dev-deploy.outputs.APP_INGRESS_URL}}
            URL: ${{needs.dev-deploy.outputs.application-url}}
          run: |
            echo $URL
            echo "--------------------------------------------------"
            curl https://$URL/live -s -k | jq -r .status | grep -i live
